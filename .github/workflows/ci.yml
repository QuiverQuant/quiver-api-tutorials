name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Scripts hit live APIs and take a long time to run, so CI only checks that
  # they're syntactically valid on every supported Python version.
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all strategy scripts
        run: python -m compileall -q strategies
